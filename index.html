<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1030">
  <title>החבר'ה של החתונה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>סרקת חולצה 👀</h1>
    <p>מזל טוב, מצאת את החבר'ה של החתונה. הגלילה על אחריותך בלבד.</p>
  </header>

  <section id="song" class="song"></section>

  <main id="gallery" class="gallery"></main>

  <footer class="bottom">זה כל החומר המפליל שיש לנו. עכשיו חזרה לרחבה 💃</footer>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="סגירה">✕</button>
    <button class="lb-nav lb-prev" aria-label="הקודם">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <video id="lb-video" controls playsinline hidden></video>
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-nav lb-next" aria-label="הבא">›</button>
    <div id="lb-count" class="lb-count"></div>
  </div>

  <script>
    // Always load the latest photo list, skipping the browser cache
    (function () {
      var v = Date.now();
      var p = document.createElement("script");
      p.src = "photos.js?v=" + v;
      p.onload = function () {
        var s = document.createElement("script");
        s.src = "song.js?v=" + v;
        s.onload = s.onerror = function () {
          var a = document.createElement("script");
          a.src = "app.js?v=" + v;
          document.body.appendChild(a);
        };
        document.body.appendChild(s);
      };
      document.body.appendChild(p);
    })();
  </script>
</body>
</html>
